name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --project tests/DbClient.Tests -c Release
      - run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/DbClient.App -c Release -o artifacts/publish -p:Version=$version
          if ($LASTEXITCODE) { exit 1 }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/windows/qorra.iss
          if ($LASTEXITCODE) { exit 1 }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "artifacts/installer/Qorra-Setup-$version.exe" --title "Qorra $version" --generate-notes --verify-tag
